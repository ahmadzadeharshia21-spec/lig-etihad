<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیگ مجازی اتحاد | مرجع رسمی مسابقات و بازیکنان</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070d12;
            --card-bg: rgba(14, 25, 36, 0.85);
            --card-border: rgba(46, 204, 113, 0.25);
            --accent-green: #00ff87;
            --accent-gold: #ffd700;
            --accent-blue: #00b4d8;
            --text-main: #f0f4f8;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 255, 135, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 180, 216, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        header { background: rgba(7, 13, 18, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 100; }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent-green), var(--accent-blue)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #070d12; box-shadow: 0 0 15px rgba(0, 255, 135, 0.4); }
        .logo-text h1 { font-size: 1.3rem; font-weight: 800; color: #fff; }
        .logo-text p { font-size: 0.75rem; color: var(--accent-green); }
        
        .nav-stats { display: flex; gap: 15px; background: rgba(255, 255, 255, 0.03); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.85rem; }
        .nav-stats span { color: var(--accent-gold); font-weight: bold; }

        .hero { text-align: center; padding: 35px 20px 15px; max-width: 800px; margin: 0 auto; }
        .hero-badge { display: inline-block; background: rgba(0, 255, 135, 0.1); color: var(--accent-green); border: 1px solid rgba(0, 255, 135, 0.3); padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; margin-bottom: 10px; }
        .hero h2 { font-size: 1.9rem; font-weight: 900; margin-bottom: 8px; color: #fff; }
        .hero p { color: var(--text-muted); font-size: 0.9rem; }

        /* Navigation Views */
        .controls-wrapper { max-width: 1200px; margin: 15px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 15px; align-items: center; width: 100%; }
        .main-tabs { display: flex; gap: 8px; background: rgba(255, 255, 255, 0.04); padding: 5px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 20px; border-radius: 25px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
        .tab-btn.active { background: linear-gradient(135deg, var(--accent-green), var(--accent-blue)); color: #070d12; box-shadow: 0 2px 10px rgba(0, 255, 135, 0.3); }

        .search-and-filter { display: flex; gap: 10px; width: 100%; max-width: 600px; }
        .search-box { position: relative; flex: 1; }
        .search-box input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 11px 40px 11px 15px; border-radius: 12px; color: #fff; font-size: 0.9rem; outline: none; transition: all 0.3s ease; }
        .search-box input:focus { border-color: var(--accent-green); background: rgba(255, 255, 255, 0.08); }
        .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .sort-select { background: #0e1924; color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.1); padding: 0 12px; border-radius: 12px; font-size: 0.85rem; outline: none; cursor: pointer; }

        /* Grid Cards */
        .content-grid { max-width: 1200px; margin: 15px auto 40px; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; }
        
        /* Team Card */
        .team-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; transition: transform 0.3s ease; position: relative; overflow: hidden; }
        .team-card:hover { transform: translateY(-5px); border-color: var(--accent-green); }
        .team-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--accent-green), var(--accent-blue)); }
        
        .team-header { display: flex; align-items: center; gap: 14px; }
        .team-logo-wrap { width: 55px; height: 55px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; padding: 6px; flex-shrink: 0; }
        .team-logo-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .team-title h3 { font-size: 1.15rem; font-weight: 700; color: #fff; }
        .team-title .manager { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }
        .team-title .manager span { color: var(--accent-green); font-weight: 600; }

        .team-details { background: rgba(0, 0, 0, 0.3); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.8rem; }
        .detail-item { display: flex; flex-direction: column; gap: 2px; }
        .detail-item .label { color: var(--text-muted); font-size: 0.72rem; }
        .detail-item .val { color: var(--text-main); font-weight: 600; }

        .stadium-box { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; border-top: 1px dashed rgba(255, 255, 255, 0.08); padding-top: 10px; }
        .trophy-tag { background: rgba(255, 215, 0, 0.1); color: var(--accent-gold); border: 1px solid rgba(255, 215, 0, 0.25); padding: 4px 10px; border-radius: 8px; font-size: 0.78rem; display: flex; align-items: center; gap: 6px; font-weight: 600; width: fit-content; }

        /* Player Card */
        .player-card { background: var(--card-bg); border: 1px solid rgba(0, 180, 216, 0.2); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.3s ease; position: relative; }
        .player-card:hover { transform: translateY(-5px); border-color: var(--accent-blue); }
        .player-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--accent-blue), var(--accent-green)); }
        .player-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .player-main-info { display: flex; align-items: center; gap: 12px; }
        .player-avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--accent-blue); }
        .player-name h3 { font-size: 1.05rem; font-weight: 700; color: #fff; }
        .player-name p { font-size: 0.78rem; color: var(--accent-green); }
        .player-value-badge { background: rgba(0, 255, 135, 0.12); color: var(--accent-green); border: 1px solid rgba(0, 255, 135, 0.3); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 800; }
        .player-stats-grid { background: rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 5px; font-size: 0.78rem; }
        .player-stats-grid div span { display: block; color: var(--text-muted); font-size: 0.7rem; margin-bottom: 2px; }
        .player-stats-grid div strong { color: #fff; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="logo-text"><h1>لیگ مجازی اتحاد</h1><p>سامانه رسمی مسابقات، نقل‌وانتقالات و ارزش‌گذاری</p></div>
            </div>
            <div class="nav-stats"><div>مجموع تیم‌ها: <span>۱۶</span></div></div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-badge">سامانه جامع مسابقات</div>
        <h2 id="viewTitle">باشگاه‌های لیگ مجازی اتحاد</h2>
        <p id="viewSubtitle">مشاهده اطلاعات رسمی تیم‌ها، ارزش‌گذاری و آمار مسابقات</p>
    </section>

    <div class="controls-wrapper">
        <div class="main-tabs">
            <button class="tab-btn active" onclick="switchView('pro', this)">لیگ برتر</button>
            <button class="tab-btn" onclick="switchView('azadegan', this)">لیگ آزادگان</button>
            <button class="tab-btn" onclick="switchView('players', this)">بازیکنان (نقل‌وانتقالات)</button>
        </div>
        <div class="search-and-filter">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="handleFilter()" placeholder="جستجوی تیم یا بازیکن...">
            </div>
            <select id="sortSelect" class="sort-select" onchange="handleSort()" style="display: none;">
                <option value="val-desc">بیشترین ارزش مارکت</option>
                <option value="val-asc">کمترین ارزش مارکت</option>
                <option value="age-asc">جوان‌ترین</option>
            </select>
        </div>
    </div>

    <main class="content-grid" id="mainContainer"></main>

    <script>
        // دیتای تیم‌ها
        const teamsData = {
            pro: [
                { name: "استقلال تهران", manager: "در انتظار انتخاب", stadium: "ورزشگاه آزادی", trophies: "۹ جام", avgAge: "۲۶.۸ سال", marketValue: "۱۴.۵ م €", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Esteghlal_Tehran_FC_logo.svg/240px-Esteghlal_Tehran_FC_logo.svg.png" },
                { name: "پرسپولیس تهران", manager: "در انتظار انتخاب", stadium: "ورزشگاه آزادی", trophies: "۱۶ جام", avgAge: "۲۷.۵ سال", marketValue: "۱۵.۲ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/0/05/FC_Persepolis_logo.png/240px-FC_Persepolis_logo.png" },
                { name: "سپاهان اصفهان", manager: "در انتظار انتخاب", stadium: "ورزشگاه نقش جهان", trophies: "۵ جام", avgAge: "۲۶.۱ سال", marketValue: "۱۲.۸ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/f/f6/Sepahan_FC_logo.png/240px-Sepahan_FC_logo.png" },
                { name: "تراکتور تبریز", manager: "در انتظار انتخاب", stadium: "ورزشگاه یادگار امام", trophies: "۲ جام", avgAge: "۲۶.۴ سال", marketValue: "۱۱.۹ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/3/36/Tractor_S.C._logo.png/240px-Tractor_S.C._logo.png" },
                { name: "گل‌گهر سیرجان", manager: "در انتظار انتخاب", stadium: "ورزشگاه سردار سلیمانی", trophies: "بدون جام", avgAge: "۲۵.۹ سال", marketValue: "۷.۳ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/9/98/Gol_Gohar_Sirjan_FC_logo.png/240px-Gol_Gohar_Sirjan_FC_logo.png" },
                { name: "فولاد خوزستان", manager: "در انتظار انتخاب", stadium: "ورزشگاه فولاد آرنا", trophies: "۲ جام", avgAge: "۲۵.۴ سال", marketValue: "۸.۱ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/d/d7/Foolad_Khuzestan_FC_logo.png/240px-Foolad_Khuzestan_FC_logo.png" },
                { name: "چادرملو اردکان", manager: "در انتظار انتخاب", stadium: "ورزشگاه شهید نصیری", trophies: "بدون جام", avgAge: "۲۴.۹ سال", marketValue: "۴.۵ م €", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Chadormalu_SC_logo.png/240px-Chadormalu_SC_logo.png" },
                { name: "فجرسپاسی شیراز", manager: "در انتظار انتخاب", stadium: "ورزشگاه پارس شیراز", trophies: "۱ جام", avgAge: "۲۴.۱ سال", marketValue: "۳.۹ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/1/1d/Fajr_Sepasi_Shiraz_FC_logo.png/240px-Fajr_Sepasi_Shiraz_FC_logo.png" }
            ],
            azadegan: [
                { name: "نساجی مازندران", manager: "در انتظار انتخاب", stadium: "ورزشگاه شهید وطنی", trophies: "۱ جام", avgAge: "۲۶.۰ سال", marketValue: "۵.۸ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/d/d4/Nassaji_FC_logo.png/240px-Nassaji_FC_logo.png" },
                { name: "ملوان بندرانزلی", manager: "در انتظار انتخاب", stadium: "ورزشگاه سیروس قایقران", trophies: "۳ جام", avgAge: "۲۴.۸ سال", marketValue: "۶.۴ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/2/25/Malavan_FC_logo.png/240px-Malavan_FC_logo.png" },
                { name: "استقلال خوزستان", manager: "در انتظار انتخاب", stadium: "ورزشگاه غدیر", trophies: "۱ جام", avgAge: "۲۵.۲ سال", marketValue: "۵.۰ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/9/90/Esteghlal_Khuzestan_FC_logo.png/240px-Esteghlal_Khuzestan_FC_logo.png" },
                { name: "پیکان تهران", manager: "در انتظار انتخاب", stadium: "ورزشگاه شهر قدس", trophies: "۱ جام", avgAge: "۲۳.۹ سال", marketValue: "۴.۲ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/5/52/Paykan_FC_logo.png/240px-Paykan_FC_logo.png" },
                { name: "خیبر خرم‌آباد", manager: "در انتظار انتخاب", stadium: "ورزشگاه تختی", trophies: "۱ جام", avgAge: "۲۵.۱ سال", marketValue: "۴.۰ م €", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Kheybar_Khorramabad_FC_logo.png/240px-Kheybar_Khorramabad_FC_logo.png" },
                { name: "شمس آذر قزوین", manager: "در انتظار انتخاب", stadium: "ورزشگاه سردار آزادگان", trophies: "۱ جام", avgAge: "۲۴.۴ سال", marketValue: "۴.۶ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/a/ab/Shams_Azar_Qazvin_FC_logo.png/240px-Shams_Azar_Qazvin_FC_logo.png" },
                { name: "آلومینیوم اراک", manager: "در انتظار انتخاب", stadium: "ورزشگاه امام خمینی", trophies: "بدون جام", avgAge: "۲۵.۷ سال", marketValue: "۵.۲ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/0/07/Aluminium_Arak_FC_logo.png/240px-Aluminium_Arak_FC_logo.png" },
                { name: "ذوب‌آهن اصفهان", manager: "در انتظار انتخاب", stadium: "ورزشگاه فولادشهر", trophies: "۴ جام", avgAge: "۲۶.۵ سال", marketValue: "۵.۶ م €", logo: "https://upload.wikimedia.org/wikipedia/fa/thumb/1/10/Zob_Ahan_Esfahan_FC_logo.png/240px-Zob_Ahan_Esfahan_FC_logo.png" }
            ]
        };

        // دیتای نمونه بازیکنان (آماده برای اضافه شدن ۵۰۰ بازیکن)
        let playersData = [
            { name: "مهدی ترابی", team: "تراکتور تبریز", position: "وینگر", age: 29, value: 1.5, valueDisplay: "۱.۵ م €", nationality: "ایران" },
            { name: "حسین حسینی", team: "استقلال تهران", position: "دروازه‌بان", age: 31, value: 1.2, valueDisplay: "۱.۲ م €", nationality: "ایران" },
            { name: "اوستون اورونوف", team: "پرسپولیس تهران", position: "وینگر", age: 23, value: 2.5, valueDisplay: "۲.۵ م €", nationality: "ازبکستان" },
            { name: "رامین رضاییان", team: "استقلال تهران", position: "دفاع راست", age: 34, value: 1.0, valueDisplay: "۱.۰ م €", nationality: "ایران" },
            { name: "امید نورافکن", team: "ملوان بندرانزلی", position: "هافبک", age: 27, value: 1.1, valueDisplay: "۱.۱ م €", nationality: "ایران" }
        ];

        let currentView = 'pro';

        function renderView() {
            const container = document.getElementById('mainContainer');
            const sortSelect = document.getElementById('sortSelect');
            container.innerHTML = '';

            if (currentView === 'players') {
                sortSelect.style.display = 'block';
                document.getElementById('viewTitle').innerText = 'مارکت و لیست بازیکنان';
                document.getElementById('viewSubtitle').innerText = 'بررسی ارزش نقل‌وانتقالات، پست‌ها و مشخصات بازیکنان';

                playersData.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                        <div class="player-header">
                            <div class="player-main-info">
                                <div class="player-avatar"><i class="fa-solid fa-user"></i></div>
                                <div class="player-name">
                                    <h3>${p.name}</h3>
                                    <p>${p.team}</p>
                                </div>
                            </div>
                            <div class="player-value-badge">${p.valueDisplay}</div>
                        </div>
                        <div class="player-stats-grid">
                            <div><span>پست</span><strong>${p.position}</strong></div>
                            <div><span>سن</span><strong>${p.age} سال</strong></div>
                            <div><span>ملیت</span><strong>${p.nationality}</strong></div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                sortSelect.style.display = 'none';
                document.getElementById('viewTitle').innerText = currentView === 'pro' ? 'تیم‌های لیگ برتر' : 'تیم‌های لیگ آزادگان';
                document.getElementById('viewSubtitle').innerText = 'مشاهده اطلاعات رسمی تیم‌ها، ارزش‌گذاری و آمار مسابقات';

                teamsData[currentView].forEach(team => {
                    const card = document.createElement('div');
                    card.className = 'team-card';
                    card.innerHTML = `
                        <div class="team-header">
                            <div class="team-logo-wrap"><img src="${team.logo}" alt="${team.name}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1165/1165187.png';"></div>
                            <div class="team-title"><h3>${team.name}</h3><div class="manager">مدیرعامل: <span>${team.manager}</span></div></div>
                        </div>
                        <div class="team-details">
                            <div class="detail-item"><span class="label">میانگین سنی</span><span class="val">${team.avgAge}</span></div>
                            <div class="detail-item"><span class="label">ارزش تیم</span><span class="val">${team.marketValue}</span></div>
                        </div>
                        <div class="stadium-box"><i class="fa-solid fa-location-dot"></i><span>${team.stadium}</span></div>
                        <div class="trophy-tag"><i class="fa-solid fa-trophy"></i><span>${team.trophies}</span></div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function switchView(viewKey, btnElement) {
            currentView = viewKey;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('searchInput').value = '';
            renderView();
        }

        function handleFilter() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.team-card, .player-card');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(input) ? 'flex' : 'none';
            });
        }

        function handleSort() {
            const criteria = document.getElementById('sortSelect').value;
            if (criteria === 'val-desc') playersData.sort((a, b) => b.value - a.value);
            else if (criteria === 'val-asc') playersData.sort((a, b) => a.value - b.value);
            else if (criteria === 'age-asc') playersData.sort((a, b) => a.age - b.age);
            renderView();
        }

        window.onload = renderView;
    </script>
</body>
</html>
